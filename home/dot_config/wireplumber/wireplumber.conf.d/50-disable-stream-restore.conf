# Disable WirePlumber per-stream volume/target persistence. quickshell's PipeWire
# module deadlocks/crashes at boot reading this persisted stream state
# ("pw_core_sync timed out" freeze / QAudioContext segfault). Cost: apps no longer
# remember their individual volume/output across sessions. Remove to revert.
wireplumber.settings = {
  node.stream.restore-props = false
  node.stream.restore-target = false
}
