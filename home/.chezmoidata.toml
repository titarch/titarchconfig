# per-host data, template lookup: index .hosts .chezmoi.hostname
# grodarch mapping. connector names shuffle on hardware changes -> match by
# panel serial (VG27A x3). remapped 2026-09-19 after a mobo+CPU swap.
[[hosts.grodarch.monitors]]
wayland = "DP-4"   # serial M1LMQS109598 (left)
mode = "2560x1440@144"
pos = "0x0"

[[hosts.grodarch.monitors]]
wayland = "DP-3"   # serial L6LMQS143616 (mid, main/BIOS)
mode = "2560x1440@144"
pos = "2560x0"
primary = true

[[hosts.grodarch.monitors]]
wayland = "DP-5"   # serial KCLMQS100054 (right)
mode = "2560x1440@144"
pos = "5120x0"

# Active theme palette (currently Dracula): single source of truth for the
# kitty, hypr and DMS themes. Swap the desktop's colors by editing these values
# only -- no template edits. Two hypr colors stay inline on purpose: the muted
# window-border gradient (less distracting) and the shadow.
[theme]
bg           = "#282a36"
bgDark       = "#21222c"   # ANSI black / DMS container lowest
currentLine  = "#44475a"   # selection bg / DMS surfaceVariant
fg           = "#f8f8f2"
comment      = "#6272a4"   # ANSI bright-black / DMS outline
white        = "#ffffff"
cyan         = "#8be9fd"
cyanBright   = "#a4ffff"
green        = "#50fa7b"
greenBright  = "#69ff94"
yellow       = "#f1fa8c"
yellowBright = "#ffffa5"
red          = "#ff5555"
redBright    = "#ff6e6e"
pink         = "#ff79c6"
pinkBright   = "#ff92df"
purple       = "#bd93f9"
purpleBright = "#d6acff"
purpleDim    = "#503d80"   # DMS primaryContainer / hypr groupbar active
surfaceVariantText = "#bfc5e0"
surfaceLow         = "#262834"
surface            = "#2b2d3a"
surfaceHigh        = "#313445"
surfaceHighest     = "#3b3e52"
